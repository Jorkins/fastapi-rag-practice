[project]
name = "fastapi-rag-practice"
version = "0.1.0"
description = "FastAPI + RAG + SQLAlchemy + Celery + Redis 闭环实践工程（教学向）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "apscheduler>=3.10",
    "numpy>=2.1",
    "pgvector>=0.3",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
